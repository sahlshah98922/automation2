version: "3.8"

services:
  db:
    image: mysql:latest
    container_name: mysql-container
    restart: on-failure
    environment:
      MYSQL_ROOT_PASSWORD: Root@123
      MYSQL_DATABASE: automation5  # ✅ Database name corrected
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - my-network

  backend:
    build: .
    container_name: sahilshah989/java-app  # ✅ Removed ":latest" from container name
    restart: on-failure
    ports:
      - "9082:9082"
    environment:
      DB_HOST: db
      MYSQL_ROOT_PASSWORD: Root@123
      MYSQL_DATABASE: automation5  # ✅ Consistent database name
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/automation4?createDatabaseIfNotExist=true&useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Root@123
    depends_on:
      - db  # ✅ Ensures MySQL starts before backend
    networks:
      - my-network

networks:
  my-network:
    driver: bridge

volumes:
  mysql_data:
